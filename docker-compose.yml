services:
  postgres:
    image: postgres:16-alpine
    container_name: stellarwatch-postgres
    environment:
      POSTGRES_DB: stellarwatch
      POSTGRES_USER: stellarwatch
      POSTGRES_PASSWORD: stellarwatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/indexer/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellarwatch -d stellarwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
